<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#475569"/>
    </marker>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1600" height="920" fill="#f8fafc"/>

  <text x="800" y="48" text-anchor="middle" font-size="30" font-weight="700" fill="#0f172a">DIAGRAMA DE ARQUITECTURA POR CAPAS — EMBRIAGADOS CRUD</text>
  <text x="800" y="82" text-anchor="middle" font-size="17" fill="#475569">Modelo cliente-servidor · API REST · Patrón Repository · SQLite</text>

  <!-- CAPA 1 -->
  <g filter="url(#shadow)">
    <rect x="30" y="130" width="340" height="700" rx="14" fill="#ffffff" stroke="#dbe3ee"/>
    <rect x="30" y="130" width="340" height="64" rx="14" fill="#2563eb"/>
    <rect x="30" y="176" width="340" height="18" fill="#2563eb"/>
    <text x="200" y="158" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">CAPA 1 · PRESENTACIÓN</text>
    <text x="200" y="181" text-anchor="middle" font-size="13" fill="#dbeafe">React + Vite</text>
  </g>

  <g fill="#ffffff" stroke="#dbe3ee">
    <rect x="48" y="214" width="304" height="78" rx="9"/>
    <rect x="48" y="306" width="304" height="92" rx="9"/>
    <rect x="48" y="412" width="304" height="104" rx="9"/>
    <rect x="48" y="530" width="304" height="86" rx="9"/>
    <rect x="48" y="630" width="304" height="86" rx="9"/>
  </g>
  <g fill="#0f172a" font-size="14">
    <text x="64" y="240" font-weight="700">React + Vite</text>
    <text x="64" y="264" fill="#475569">Aplicación web (SPA)</text>

    <text x="64" y="332" font-weight="700">Vistas</text>
    <text x="64" y="356" fill="#475569">Productos · Categorías</text>
    <text x="64" y="378" fill="#475569">Ingredientes · Clientes · Ventas</text>

    <text x="64" y="438" font-weight="700">Componentes de interfaz</text>
    <text x="64" y="462" fill="#475569">Navbar.jsx · Tabla.jsx</text>
    <text x="64" y="484" fill="#475569">Formulario.jsx · Modal.jsx</text>
    <text x="64" y="506" fill="#475569">Layout.jsx</text>

    <text x="64" y="556" font-weight="700">Cliente HTTP: api.js</text>
    <text x="64" y="580" fill="#475569">Envía peticiones y recibe JSON</text>
    <text x="64" y="602" fill="#475569">Hook useCrud para el CRUD</text>

    <text x="64" y="656" font-weight="700">Responsabilidad</text>
    <text x="64" y="680" fill="#475569">Mostrar la interfaz al usuario</text>
    <text x="64" y="702" fill="#475569">y capturar sus acciones</text>
  </g>

  <!-- CAPA 2 -->
  <g filter="url(#shadow)">
    <rect x="430" y="130" width="340" height="700" rx="14" fill="#ffffff" stroke="#e5dcf7"/>
    <rect x="430" y="130" width="340" height="64" rx="14" fill="#7c3aed"/>
    <rect x="430" y="176" width="340" height="18" fill="#7c3aed"/>
    <text x="600" y="158" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">CAPA 2 · APLICACIÓN</text>
    <text x="600" y="181" text-anchor="middle" font-size="13" fill="#ede9fe">API y lógica de negocio</text>
  </g>

  <g fill="#ffffff" stroke="#e5dcf7">
    <rect x="448" y="214" width="304" height="78" rx="9"/>
    <rect x="448" y="306" width="304" height="104" rx="9"/>
    <rect x="448" y="424" width="304" height="104" rx="9"/>
    <rect x="448" y="542" width="304" height="86" rx="9"/>
    <rect x="448" y="642" width="304" height="74" rx="9"/>
  </g>
  <g fill="#0f172a" font-size="14">
    <text x="464" y="240" font-weight="700">API REST</text>
    <text x="464" y="264" fill="#475569">Node.js + Express</text>

    <text x="464" y="332" font-weight="700">Rutas REST</text>
    <text x="464" y="356" fill="#475569">products.js · categories.js</text>
    <text x="464" y="378" fill="#475569">ingredients.js · customers.js</text>
    <text x="464" y="400" fill="#475569">sales.js</text>

    <text x="464" y="450" font-weight="700">Servicios</text>
    <text x="464" y="474" fill="#475569">ProductService · CategoryService</text>
    <text x="464" y="496" fill="#475569">IngredientService · CustomerService</text>
    <text x="464" y="518" fill="#475569">SaleService · InventoryService</text>

    <text x="464" y="568" font-weight="700">Lógica de negocio</text>
    <text x="464" y="592" fill="#475569">Validaciones y reglas</text>
    <text x="464" y="614" fill="#475569">Ventas, stock y transacciones</text>

    <text x="464" y="668" font-weight="700">Respuesta</text>
    <text x="464" y="692" fill="#475569">HTTP / JSON al frontend</text>
  </g>

  <!-- CAPA 3 -->
  <g filter="url(#shadow)">
    <rect x="830" y="130" width="340" height="700" rx="14" fill="#ffffff" stroke="#cdeef4"/>
    <rect x="830" y="130" width="340" height="64" rx="14" fill="#0891b2"/>
    <rect x="830" y="176" width="340" height="18" fill="#0891b2"/>
    <text x="1000" y="158" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">CAPA 3 · ACCESO A DATOS</text>
    <text x="1000" y="181" text-anchor="middle" font-size="13" fill="#cffafe">Patrón Repository</text>
  </g>

  <g fill="#ffffff" stroke="#cdeef4">
    <rect x="848" y="214" width="304" height="78" rx="9"/>
    <rect x="848" y="306" width="304" height="86" rx="9"/>
    <rect x="848" y="406" width="304" height="132" rx="9"/>
    <rect x="848" y="552" width="304" height="86" rx="9"/>
    <rect x="848" y="652" width="304" height="74" rx="9"/>
  </g>
  <g fill="#0f172a" font-size="14">
    <text x="864" y="240" font-weight="700">Patrón Repository</text>
    <text x="864" y="264" fill="#475569">Contrato: Repository.js</text>

    <text x="864" y="332" font-weight="700">Implementación base</text>
    <text x="864" y="356" fill="#475569">SqliteRepository.js</text>
    <text x="864" y="378" fill="#475569">CRUD común en SQLite</text>

    <text x="864" y="432" font-weight="700">Repositorios concretos</text>
    <text x="864" y="456" fill="#475569">ProductRepository</text>
    <text x="864" y="478" fill="#475569">CategoryRepository</text>
    <text x="864" y="500" fill="#475569">IngredientRepository</text>
    <text x="864" y="522" fill="#475569">CustomerRepository · SaleRepository</text>

    <text x="864" y="578" font-weight="700">Encapsulamiento</text>
    <text x="864" y="602" fill="#475569">Todo el SQL vive aquí</text>
    <text x="864" y="624" fill="#475569">Consultas y mapeo de datos</text>

    <text x="864" y="678" font-weight="700">Responsabilidad</text>
    <text x="864" y="702" fill="#475569">Entregar datos a los servicios</text>
  </g>

  <!-- CAPA 4 -->
  <g filter="url(#shadow)">
    <rect x="1230" y="130" width="340" height="700" rx="14" fill="#ffffff" stroke="#d1fae5"/>
    <rect x="1230" y="130" width="340" height="64" rx="14" fill="#059669"/>
    <rect x="1230" y="176" width="340" height="18" fill="#059669"/>
    <text x="1400" y="158" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">CAPA 4 · PERSISTENCIA</text>
    <text x="1400" y="181" text-anchor="middle" font-size="13" fill="#d1fae5">Almacenamiento</text>
  </g>

  <g fill="#ffffff" stroke="#d1fae5">
    <rect x="1248" y="214" width="304" height="78" rx="9"/>
    <rect x="1248" y="306" width="304" height="104" rx="9"/>
    <rect x="1248" y="424" width="304" height="86" rx="9"/>
    <rect x="1248" y="524" width="304" height="86" rx="9"/>
    <rect x="1248" y="624" width="304" height="86" rx="9"/>
  </g>
  <g fill="#0f172a" font-size="14">
    <text x="1264" y="240" font-weight="700">SQLite</text>
    <text x="1264" y="264" fill="#475569">db.js</text>

    <text x="1264" y="332" font-weight="700">Tablas principales</text>
    <text x="1264" y="356" fill="#475569">Category · Product · Ingredient</text>
    <text x="1264" y="378" fill="#475569">Customer · Sale</text>
    <text x="1264" y="400" fill="#475569">Claves foráneas (FK)</text>

    <text x="1264" y="450" font-weight="700">Transacciones</text>
    <text x="1264" y="474" fill="#475569">Venta + descuento de stock</text>
    <text x="1264" y="496" fill="#475569">Todo o nada</text>

    <text x="1264" y="550" font-weight="700">Modo WAL</text>
    <text x="1264" y="574" fill="#475569">Lectura y escritura seguras</text>
    <text x="1264" y="596" fill="#475569">Integridad referencial</text>

    <text x="1264" y="650" font-weight="700">Responsabilidad</text>
    <text x="1264" y="674" fill="#475569">Guardar y conservar los datos</text>
    <text x="1264" y="696" fill="#475569">del sistema</text>
  </g>

  <!-- Flechas -->
  <line x1="372" y1="470" x2="426" y2="470" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="356" y="438" width="88" height="26" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="400" y="456" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">HTTP / JSON</text>

  <line x1="772" y1="470" x2="826" y2="470" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="748" y="438" width="104" height="26" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="800" y="456" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">repositorio</text>

  <line x1="1172" y1="470" x2="1226" y2="470" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="1170" y="438" width="60" height="26" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="1200" y="456" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">SQL</text>

  <!-- Flujo inferior -->
  <rect x="130" y="856" width="1340" height="46" rx="10" fill="#e2e8f0" stroke="#cbd5e1"/>
  <text x="800" y="884" text-anchor="middle" font-size="15" fill="#0f172a">
    Flujo de una petición: Navegador → api.js → ruta Express → servicio → repositorio → SQLite → respuesta JSON
  </text>

  <!-- Encabezado lateral -->
  <text x="1570" y="48" text-anchor="end" font-size="12" font-weight="700" fill="#94a3b8">DISEÑO LÓGICO DEL SISTEMA</text>
</svg>
